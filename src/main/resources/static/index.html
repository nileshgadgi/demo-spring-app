<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Spring App</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f8; color: #222; margin: 0; }
        .container { max-width: 720px; margin: 60px auto; background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 { margin-top: 0; color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        td:first-child { font-weight: bold; width: 35%; }
        .up { color: #1e8e3e; font-weight: bold; }
        .down { color: #d93025; font-weight: bold; }
        .links a { margin-right: 16px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Demo Spring App</h1>
    <p>Spring Boot application deployed on Kubernetes through GitHub Actions and Argo CD.</p>
    <table>
        <tr><td>Status</td><td id="status">checking...</td></tr>
        <tr><td>Version</td><td id="version">-</td></tr>
        <tr><td>Environment</td><td id="environment">-</td></tr>
        <tr><td>Served by pod</td><td id="hostname">-</td></tr>
        <tr><td>Java</td><td id="java">-</td></tr>
    </table>
    <p class="links">
        <a href="/api/health">/api/health</a>
        <a href="/api/info">/api/info</a>
        <a href="/api/greeting?name=DevOps">/api/greeting</a>
    </p>
</div>
<script>
    fetch('/api/info').then(r => r.json()).then(d => {
        document.getElementById('version').textContent = d.version;
        document.getElementById('environment').textContent = d.environment;
        document.getElementById('hostname').textContent = d.hostname;
        document.getElementById('java').textContent = d.javaVersion;
    });
    fetch('/api/health').then(r => r.json()).then(d => {
        const el = document.getElementById('status');
        el.textContent = d.status;
        el.className = d.status === 'UP' ? 'up' : 'down';
    }).catch(() => {
        const el = document.getElementById('status');
        el.textContent = 'DOWN';
        el.className = 'down';
    });
</script>
</body>
</html>
