apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: demo-spring-app-config
    namespace: demo-app
    literals:
      - APP_VERSION=c2eee72

images:
  - name: nileshgadgi/demo-spring-app
    newTag: c2eee72
