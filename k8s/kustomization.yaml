apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: demo-spring-app-config
    namespace: demo-app
    literals:
      - APP_VERSION=latest

images:
  - name: DOCKERHUB_USER/demo-spring-app
    newTag: latest
